<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS Desk — Staff sign-in</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf5f2;color:#172c32;font:16px system-ui,sans-serif}main{width:min(420px,92vw);padding:36px;background:white;border:1px solid #dce8e2;border-radius:18px}small{color:#14786b;font-weight:700;letter-spacing:2px}h1{font-size:28px;margin:20px 0 8px}p{color:#657973;line-height:1.6}label{display:block;margin:20px 0 7px}input,button{width:100%;padding:13px;border:1px solid #bdcec6;border-radius:8px;font:inherit}button{margin-top:24px;background:#14786b;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.6}#error{color:#a32626;font-size:14px}a{color:#14786b}</style>
<main><small>CS DESK</small><h1>Welcome back</h1><p>Sign in with your approved staff account to access tickets.</p><form id="login"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button><p id="error" role="alert"></p></form><p style="font-size:13px">Need access or a password reset? Contact your CS administrator.</p></main>
<script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;err.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/');}catch(e){err.textContent=e.message||'Unable to sign in.';}finally{document.getElementById('password').value='';b.disabled=false;}};</script></html>
