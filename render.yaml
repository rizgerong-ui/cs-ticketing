services:
  - type: web
    name: cs-ticketing
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PGHOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: postgres
      - key: PGUSER
        value: postgres.phcvhjincnuvkeouqcaq
      - key: PGPASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://phcvhjincnuvkeouqcaq.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CS_STAFF_DOMAIN
        value: findme.com.ph
      - key: TZ
        value: Asia/Taipei
